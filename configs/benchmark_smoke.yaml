# Smoke test configuration: Runs quickly for verification
n_samples: 200
n_seeds: 1
model_types: ["linear", "ned"]
sparsities: [0.0, 0.5]
# One budget name; each method takes the entry for its unit
# (pysimlr.describe_method(name)['budget_unit']).
budget_by_unit:
  iterations: 5
  epochs: 10
warmup_epochs: 2
case_kind: "nonlinear"
save_prefix: "smoke_results"
