[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysimlr"
version = "0.5.0"
description = "A professional PyTorch implementation of SIMLR"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    # Required, not optional. `simlr_sparseness` is a call to NSA-Flow: it is
    # the projection that defines SiMLR's feasible set (non-negative,
    # near-orthogonal, disjoint at w -> 1). The previous SVD-polar fallback
    # projected onto a *different* set and was applied silently whenever the
    # backend was missing, so the same code produced two different algorithms
    # depending on the install.
    # >=3.5.1: column-quantile sparseness no longer collapses tied bases to
    # rank 1 (2x2 orthonormal bases failed in 35 of 200 nnh_embed draws).
    "nsa_flow>=3.5.1",
]

[project.optional-dependencies]
# Optional retraction backend. When installed, the Stiefel/ortho constraints in
# simlr_sparseness and NSAFlowOptimizer use its flow-based retraction instead of
# the SVD polar fallback, which changes numerical results. It was previously
# undeclared and imported under three different names across three modules, so
# which path ran depended on the environment. `pysimlr.nsa_backend.backend_report()`
# reports which backend resolved; record it alongside results.
nsa = [
    "nsa-flow"
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist"
]
docs = [
    "jupyter",
    "matplotlib",
    "seaborn",
    "pyyaml"
]
dev = [
    "pysimlr[test,docs]"
]

[tool.setuptools]
package-dir = {"" = "src"}

# Discovered rather than listed, so a future subpackage is picked up without
# anyone remembering to add it here. (The previous explicit list, ["pysimlr"],
# did still ship pysimlr.benchmarks -- verified by building the wheel both ways
# -- so this is robustness, not a fix.)
[tool.setuptools.packages.find]
where = ["src"]
include = ["pysimlr*"]
