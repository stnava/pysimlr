project:
  type: book
  output-dir: _book

execute:
  freeze: auto

title: "Deep SiMLR: Auditable Multi-Modal Integration for Biomedical Discovery"
author:
  - name: Brian B. Avants
    affiliations:
      - ref: uva
  - name: Nicholas J. Tustison
    affiliations:
      - ref: uva
  - name: James R. Stone
    affiliations:
      - ref: uva

affiliations:
  - id: uva
    name: University of Virginia
    department: Department of Radiology and Medical Imaging
    city: Charlottesville
    state: VA

book:
  date: today
  chapters:
    - index.qmd
    - 01_intro_background.qmd
    - 02_methods.qmd
    - 03_experiments.qmd
    - 04_discussion.qmd
  appendices:
    - appendix_brca_clinical_validation.qmd
    - appendix_operational.qmd
    - appendix_flow_simr_v.qmd
    - appendix_reproducibility.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
  pdf:
    documentclass: report
    pdf-engine: xelatex
    fontsize: 10pt
    toc: true
    toc-depth: 2
    number-sections: true
    geometry: margin=0.85in
    keep-tex: true
    fig-pos: htbp
    include-in-header:
      text: |
        \usepackage{titlesec}
        \titleformat{\chapter}[block]{\normalfont\LARGE\bfseries}{\thechapter.\quad}{0pt}{}
        \titlespacing*{\chapter}{0pt}{-15pt}{10pt}
        \titlespacing*{\section}{0pt}{10pt}{4pt}
        \titlespacing*{\subsection}{0pt}{8pt}{3pt}
        \setlength{\tabcolsep}{4pt}
        \renewcommand{\arraystretch}{1.08}
        \AtBeginEnvironment{longtable}{\small}
