[pytest]
pythonpath = src .
testpaths = tests

# Slow tests are excluded by default so the everyday suite stays quick.
#   pytest                  -> fast suite across CPU cores (default)
#   pytest -n 0             -> single-process run
#   pytest -m slow          -> only the slow tests
#   pytest -m ""            -> everything
addopts = -n 10 --dist loadgroup --no-loadscope-reorder -m "not slow" -p no:playwright -p no:jaxtyping -p no:asyncio -p no:anyio -p no:base_url

markers =
    slow: statistical calibration and multi-seed benchmark tests (minutes, not seconds)
    golden: recomputes columns of external result ledgers; skipped unless the data root env var is set
